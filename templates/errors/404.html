{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-indigo-600">404</h1>
        <p class="text-2xl font-semibold text-gray-700 mt-4">Oops! Page not found.</p>
        <p class="text-gray-500 mt-2">The page you are looking for might have been removed or is temporarily unavailable.</p>
        <a href="{{ url_for('dashboard.index') }}" class="inline-block mt-6 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
            Go back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
