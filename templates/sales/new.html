{% extends "base.html" %}
{% block title %}New Sale{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-6">New Sale</h1>

<div class="bg-white rounded-xl shadow-md p-6">
    <form method="POST" id="saleForm">
        {{ form.hidden_tag() }}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label for="customer_id" class="block text-sm font-medium text-gray-700 mb-2">Customer</label>
                <select name="customer_id" id="customer_id" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                    <option value="0">Walk-in Customer</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="payment_method" class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
                <select name="payment_method" id="payment_method" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                    <option value="mobile">Mobile Money</option>
                </select>
            </div>
        </div>

        <!-- Items Table -->
        <div class="mb-6">
            <h3 class="text-lg font-medium mb-2">Items</h3>
            <table class="min-w-full divide-y divide-gray-200 border" id="itemsTable">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Product</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Quantity</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                        <th class="px-4 py-2"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody" class="bg-white divide-y divide-gray-200">
                    <!-- Rows added dynamically -->
                </tbody>
            </table>
            <button type="button" id="addItem" class="mt-4 bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm">
                <i class="fas fa-plus mr-1"></i>Add Item
            </button>
        </div>

        <!-- Totals -->
        <div class="flex justify-end mb-6">
            <div class="w-64">
                <div class="flex justify-between py-2">
                    <span class="font-medium">Subtotal:</span>
                    <span id="subtotal">0.00</span>
                </div>
                <div class="flex justify-between py-2 border-t">
                    <span class="font-medium">Total:</span>
                    <span id="total" class="text-xl font-bold">0.00</span>
                </div>
            </div>
        </div>

        <div class="flex justify-end space-x-4">
            <a href="{{ url_for('sales.list') }}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save Sale</button>
        </div>
    </form>
</div>

<template id="itemRowTemplate">
    <tr class="item-row">
        <td class="px-4 py-2">
            <select name="product_id[]" class="product-select w-full border-gray-300 rounded-md" required>
                <option value="">Select Product</option>
                {% for product in products %}
                <option value="{{ product.id }}" data-price="{{ product.price }}">{{ product.name }} ({{ product.sku }})</option>
                {% endfor %}
            </select>
        </td>
        <td class="px-4 py-2"><input type="number" name="quantity[]" class="quantity w-20 border-gray-300 rounded-md" min="1" value="1" required></td>
        <td class="px-4 py-2 price-display">0.00</td>
        <td class="px-4 py-2 item-total">0.00</td>
        <td class="px-4 py-2"><button type="button" class="remove-item text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button></td>
    </tr>
</template>

<script>
    const itemsBody = document.getElementById('itemsBody');
    const addItemBtn = document.getElementById('addItem');
    const subtotalSpan = document.getElementById('subtotal');
    const totalSpan = document.getElementById('total');
    let rowCount = 0;

    function updateTotals() {
        let subtotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const totalCell = row.querySelector('.item-total');
            subtotal += parseFloat(totalCell.textContent) || 0;
        });
        subtotalSpan.textContent = subtotal.toFixed(2);
        totalSpan.textContent = subtotal.toFixed(2);
    }

    function addRow() {
        const template = document.getElementById('itemRowTemplate');
        const clone = template.content.cloneNode(true);
        const row = clone.querySelector('tr');
        row.setAttribute('data-row-id', rowCount++);

        const select = row.querySelector('.product-select');
        const qtyInput = row.querySelector('.quantity');
        const priceDisplay = row.querySelector('.price-display');
        const totalCell = row.querySelector('.item-total');
        const removeBtn = row.querySelector('.remove-item');

        select.addEventListener('change', function() {
            const selected = select.options[select.selectedIndex];
            const price = selected.dataset.price || 0;
            priceDisplay.textContent = parseFloat(price).toFixed(2);
            const qty = parseInt(qtyInput.value) || 0;
            totalCell.textContent = (qty * price).toFixed(2);
            updateTotals();
        });

        qtyInput.addEventListener('input', function() {
            const price = parseFloat(priceDisplay.textContent) || 0;
            const qty = parseInt(qtyInput.value) || 0;
            totalCell.textContent = (qty * price).toFixed(2);
            updateTotals();
        });

        removeBtn.addEventListener('click', function() {
            row.remove();
            updateTotals();
        });

        itemsBody.appendChild(clone);
    }

    addItemBtn.addEventListener('click', addRow);
    addRow(); // start with one row

    document.getElementById('saleForm').addEventListener('submit', function(e) {
        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            const productId = row.querySelector('.product-select').value;
            const quantity = row.querySelector('.quantity').value;
            if (productId && quantity) {
                items.push({ product_id: parseInt(productId), quantity: parseInt(quantity) });
            }
        });
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'items';
        input.value = JSON.stringify(items);
        this.appendChild(input);
    });
</script>
{% endblock %}
